<div class="show-mobile">
  <div class="show-mobile--header">
    <button (click)="toogleMenu()">
      <img src="/svg/icon_menu.svg" alt="menu">
    </button>
    <a href="">
      <img src="/svg/logo_yard_sale.svg" alt="logo">
    </a>
    <a href="">
      <img src="/svg/icon_shopping_cart.svg" alt="carrito">
    </a>
  </div>
  <div class="side-menu" [class.active]="activeMenu">
    <button (click)="toogleMenu()">Close</button>
    <ul>
      <li><a routerLink="home">All</a></li>
      @for (item of categories(); track $index) {
      <li><a [routerLink]="['/category', item.id]">{{ item.name }}</a></li>
      }
    </ul>
  </div>
</div>
<div class="hide-mobile">
  <div>
    <nav>
      <a class="logo" href="">
        <img src="/svg/logo_yard_sale.svg" alt="logo">
      </a>
      <ul>
        <li><a routerLinkActive="active" routerLink="home">All</a></li>
        @for (item of categories(); track $index) {
        <li><a routerLinkActive="active" [routerLink]="['/category', item.id]">{{ item.name }}</a></li>
        }
      </ul>
    </nav>
    <div class="info">
      <div class="account">
        @if (!profile()) {
        <button (click)="login()">Login</button>
        } @else {
        <a routerLink="/profile">{{profile()?.email}}</a>
        <button (click)="logout()">Logout</button>
        }
      </div>
      <div class="cart">
        <a href="">
          <img src="/svg/icon_shopping_cart.svg" alt="carrito">
        </a>
        <span class="counter">{{counter}}</span>
      </div>
    </div>
  </div>
</div>
