<button (click)="onShowDetaild(1213231)">Detail not found</button> -->
<div class="products--grid">
  @for (product of products; track product.id) {
  <app-product [product]="product" (addedproduct)="onAddToShopingCart($event)"
    (showProduct)="onShowDetaild($event)"></app-product>
  }
</div>
<button (click)="onLoadMore()">Load more...</button>
<div class="product-details" [class.active]="showProductDetail()">
  {{statusDetail()}}
  @if (productChosen) {
  <div>
    <button (click)="toggleProductDetail()">Close</button>
    <h1>{{ productChosen.title }}</h1>
    <swiper-container navigation="true" pagination="true">
      @for (img of productChosen.images; track img) {
      <swiper-slide>
        <img [src]="img" alt="Product Image" style="width: 100%; object-fit: contain;">
      </swiper-slide>
      }
    </swiper-container>
    <p>{{ productChosen.description }}</p>
    <button (click)="updateProduct()">Edit</button>
    <button (click)="deleteProduct()">Delete</button>
  </div>
  }


</div>
